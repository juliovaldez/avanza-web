<dx-popup
  [visible]="isVisible"
  [showTitle]="true"
  [title]="caso.id ? 'Editar Caso de Éxito' : 'Nuevo Caso de Éxito'"
  [dragEnabled]="true"
  [showCloseButton]="true"
  [closeOnOutsideClick]="false"
  width="600px"
  height="auto"
  position="center"
  (onHidden)="onHidden()"
>
  <dx-form #form [formData]="formData" [colCount]="1" validationGroup="casoExitoForm">
    <dxi-item
      dataField="titulo"
      editorType="dxTextBox"
      [label]="{ text: 'Título' }"
    >
      <dxi-validation-rule type="required" message="Requerido"></dxi-validation-rule>
    </dxi-item>

    <dxi-item
      dataField="descripcion"
      editorType="dxTextArea"
      [label]="{ text: 'Descripción' }"
      [editorOptions]="{ height: 120 }"
    >
      <dxi-validation-rule type="required" message="Requerido"></dxi-validation-rule>
    </dxi-item>
  </dx-form>

  <div style="margin: 12px 0 4px; font-size: 13px; color: #666;">Fotografía</div>
  <dx-file-uploader
    [multiple]="false"
    accept="image/*"
    uploadMode="useForm"
    (onValueChanged)="onFileSelected($event)"
  ></dx-file-uploader>

  <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px;">
    <dx-button text="Cancelar" (onClick)="onHidden()"></dx-button>
    <dx-button text="Guardar" type="default" (onClick)="save()"></dx-button>
  </div>
</dx-popup>
