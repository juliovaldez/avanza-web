<dx-popup
  [width]="widthsSpan.width"
  height="auto"
  title="Tipo de Transacción"
  [showTitle]="true"
  position="center"
  [dragEnabled]="true"
  [showCloseButton]="true"
  [closeOnOutsideClick]="false"
  [(visible)]="popupVisible"
>
  <div id="popup">
    <dx-form [formData]="formTransactionType" labelLocation="top">
      <dxi-item
        dataField="name"
        [label]="{ text: 'Operación' }"
        [editorOptions]="{ maxLength: 50 }"
      >
        <dxi-validation-rule
          type="required"
          message="* Campo Requerido"
        ></dxi-validation-rule>
      </dxi-item>

    </dx-form>
    <div class="card-flex-box">
      <dx-button
        style="margin: 0 0 0 2rem"
        type="success"
        [text]="formTransactionType.id ? 'Actualizar' : 'Guardar'"
        (onClick)="save()"
      ></dx-button>
    </div>
  </div>
</dx-popup>
